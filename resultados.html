<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resultados de Exámenes | Prepa CONAMAT</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/resultados.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- SheetJS para exportar a Excel -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>
<body>
  <header class="header">
    <div class="header-content">
      <img src="assets/conamat_logo.png" alt="Prepa CONAMAT" class="logo">
      <div class="header-text">
        <h1>Resultados de Exámenes</h1>
        <p class="subtitle">Panel del profesor — Prepa CONAMAT</p>
      </div>
    </div>
    <nav class="nav">
      <a href="index.html" class="nav-btn">← Volver al sistema</a>
      <button class="nav-btn active" type="button">Resultados</button>
    </nav>
  </header>

  <main class="main results-main">
    <div class="results-toolbar">
      <div class="filters">
        <div class="form-group inline">
          <label for="filter-tipo">Tipo</label>
          <select id="filter-tipo">
            <option value="">Todos</option>
            <option value="examen">Examen</option>
            <option value="tarea">Tarea</option>
          </select>
        </div>
        <div class="form-group inline">
          <label for="filter-grupo">Grupo</label>
          <input type="text" id="filter-grupo" placeholder="Ej: 3A">
        </div>
        <div class="form-group inline">
          <label for="filter-horario">Horario</label>
          <select id="filter-horario">
            <option value="">Todos</option>
            <option value="Matutino">Matutino</option>
            <option value="Vespertino">Vespertino</option>
            <option value="Nocturno">Nocturno</option>
            <option value="Sabatino">Sabatino</option>
          </select>
        </div>
        <div class="form-group inline">
          <label for="filter-nombre">Nombre</label>
          <input type="text" id="filter-nombre" placeholder="Buscar alumno...">
        </div>
        <button id="btn-refresh" class="btn primary">🔄 Actualizar</button>
      </div>
      <div class="export-actions">
        <button id="btn-export-excel" class="btn success">📥 Exportar a Excel</button>
        <button id="btn-export-csv" class="btn secondary">📄 Exportar CSV</button>
      </div>
    </div>

    <div id="status-bar" class="save-status info" style="display:none;"></div>

    <div class="stats-summary" id="stats-summary">
      <div class="stat-card"><span class="stat-num" id="stat-total">0</span><span class="stat-label">Registros</span></div>
      <div class="stat-card"><span class="stat-num" id="stat-examenes">0</span><span class="stat-label">Exámenes</span></div>
      <div class="stat-card"><span class="stat-num" id="stat-promedio">—</span><span class="stat-label">Promedio</span></div>
      <div class="stat-card"><span class="stat-num" id="stat-aprobados">0</span><span class="stat-label">Aprobados (≥6)</span></div>
    </div>

    <div class="table-wrap">
      <table class="results-table" id="results-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Fecha</th>
            <th>Nombre</th>
            <th>Grupo</th>
            <th>Horario</th>
            <th>Tipo</th>
            <th>Puntuación</th>
            <th>Fotos</th>
            <th>Detalle</th>
          </tr>
        </thead>
        <tbody id="results-body">
          <tr><td colspan="9" class="empty-msg">Cargando resultados...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Modal detalle -->
  <div id="detail-modal" class="modal-overlay hidden">
    <div class="modal-card detail-modal-card">
      <button type="button" class="modal-close" id="close-detail">×</button>
      <h2>Detalle del resultado</h2>
      <div id="detail-content"></div>
    </div>
  </div>

  <footer class="footer">
    <p>© 2026 Prepa CONAMAT — Prof. Fabián Soberanes Martín</p>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/resultados.js"></script>
</body>
</html>
